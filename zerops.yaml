# Deplot monorepo — Zerops reads this from repository root.

zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm ci && npm run build
        - cd frontend && cp -r .next/static .next/standalone/.next/static
        - cd frontend && mkdir -p .next/standalone/public && (test -d public && cp -r public/. .next/standalone/public/ || true)
      deployFiles:
        - frontend/.next/standalone/~
      cache:
        - frontend/node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /
    run:
      base: nodejs@22
      envVariables:
        NODE_ENV: production
        PORT: 3000
        HOSTNAME: 0.0.0.0
      ports:
        - port: 3000
          httpSupport: true
      start: node server.js

  - setup: api
    build:
      base: python@latest
      buildCommands:
        - cd backend && pip install . --target dependencies
      deployFiles:
        - backend/~
        - prompts/
        - templates/
      cache:
        - backend/dependencies
    deploy:
      readinessCheck:
        httpGet:
          port: 8000
          path: /api/v1/health
    run:
      base: python@latest
      envVariables:
        PYTHONPATH: dependencies
      ports:
        - port: 8000
          httpSupport: true
      start: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
