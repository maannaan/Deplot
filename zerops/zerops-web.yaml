zerops:
  - setup: web
    build:
      base: nodejs@22
      envVariables:
        NEXT_PUBLIC_API_URL: https://api-2a39-8000.prg1.zerops.app/api/v1
      buildCommands:
        - cd frontend && npm ci && npm run build
      deployFiles:
        - frontend/~
      cache:
        - frontend/node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /
        failureTimeout: 120
    run:
      base: nodejs@22
      envVariables:
        NODE_ENV: production
      ports:
        - port: 3000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 3000
          path: /
      start: npm start
