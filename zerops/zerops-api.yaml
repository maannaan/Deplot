zerops:
  - setup: api
    build:
      base: python@latest
      buildCommands:
        - cd backend && pip install . --target dependencies
      deployFiles:
        - backend/~
        - prompts/
        - templates/
      cache:
        - backend/dependencies
    run:
      base: python@latest
      envVariables:
        PYTHONPATH: dependencies
      ports:
        - port: 8000
          httpSupport: true
      readiness:
        http:
          path: /api/v1/health
          statusCode: 200
      start: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
