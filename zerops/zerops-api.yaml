zerops:
  - setup: api
    build:
      base: python@latest
      buildCommands:
        - cd backend && pip install -e .
      deployFiles: backend/
    run:
      base: python@latest
      ports:
        - port: 8000
          httpSupport: true
      readiness:
        http:
          path: /api/v1/health
          statusCode: 200
      start: uvicorn app.main:app --host 0.0.0.0 --port 8000
